<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Los Aplastaos - Login Operativo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-aplastaos">

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">

        <div class="login-card p-4 text-center">

            <img src="aplasta'os.jpg"
                 alt="Logo Los Aplastaos"
                 width="250"
                 class="logo-main mb-3">

            <h1 class="h3 mb-4 text-white text-shadow-aplastaos">
                Acceso al Sistema
            </h1>

            <form id="loginForm">

                <div class="mb-3 text-start">

                    <label for="user" class="form-label text-white">
                        Usuario
                    </label>

                    <input type="text"
                           class="form-control form-control-lg input-aplastaos"
                           id="user"
                           placeholder="Ingresa tu usuario"
                           required>

                </div>

                <div class="mb-3 text-start">

                    <label for="role" class="form-label text-white">
                        Tu Puesto Operativo
                    </label>

                    <select class="form-select form-select-lg input-aplastaos"
                            id="role"
                            required>

                        <option value="" selected disabled>
                            Selecciona tu rol...
                        </option>

                        <option value="admin">
                            Administrador / Dueño
                        </option>

                        <option value="cocina">
                            Cocina
                        </option>

                        <option value="salon">
                            Mesero
                        </option>

                        <option value="domicilio">
                            Domiciliario
                        </option>

                    </select>

                </div>

                <div class="mb-4 text-start">

                    <label for="pass" class="form-label text-white">
                        Contraseña
                    </label>

                    <input type="password"
                           class="form-control form-control-lg input-aplastaos"
                           id="pass"
                           placeholder="••••••••"
                           required>

                </div>

                <button type="submit"
                        class="btn btn-aplastaos w-100 btn-lg">

                    INGRESAR

                </button>

            </form>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
